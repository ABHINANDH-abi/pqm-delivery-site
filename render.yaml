services:
  - type: web
    name: qureshi-mandi-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npx prisma db seed && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: super-secret-mandi-jwt-token-key-2026-production
      - key: JWT_REFRESH_SECRET
        value: super-secret-mandi-refresh-token-key-2026-production
      - key: DATABASE_URL
        fromDatabase:
          name: qureshi-mandi-db
          property: connectionString

databases:
  - name: qureshi-mandi-db
    databaseName: qureshimandidb
    user: qureshimandiuser
